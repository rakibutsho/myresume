name: Deploy Next.js to Azure VPS

on:
  push:
    branches:
      - main # ba apnar je branch-e code push koren

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies and Build Locally (or skip and build on VPS)
      run: |
        npm install
        npm run build

    - name: Copy files to VPS via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "."
        target: "/var/www/myresume"

    - name: Restart Next.js App via PM2 on VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /var/www/myresume
          npm install --production
          pm2 restart myresume-app || pm2 start npm --name "myresume-app" -- start